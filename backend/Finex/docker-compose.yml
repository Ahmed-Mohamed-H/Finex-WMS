services:
  seq:
    image: datalust/seq:latest
    container_name: finex-seq
    restart: unless-stopped
    environment:
      - "ACCEPT_EULA=Y"
      - "SEQ_FIRSTRUN_ADMINUSERNAME=admin"
      - "SEQ_FIRSTRUN_ADMINPASSWORD=ChangeMe_StrongPass123!"
      - "SEQ_API_CANONICALURI=http://localhost:5341"
    ports:
      - "5341:80"
    volumes:
      - seq_data:/data

volumes:
  seq_data:
